<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>超連結標籤預覽</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 預覽：即時回報展開後的「超連結」三種做法。色彩跟看板展開膠囊同一組（淺灰底 #f6f6f8、黑字）；連結顏色＝使用者在連結上選的顏色 */
:root{--bg:#000;--ink:#f1f1f4;--muted:#a3a3ae;--hair:#2c2c34}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fff;--ink:#111114;--muted:#5d5d66;--hair:#e2e2e8}}
:root[data-theme="light"]{--bg:#fff;--ink:#111114;--muted:#5d5d66;--hair:#e2e2e8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Jost","Noto Sans TC",sans-serif;padding:24px 16px 60px}
.wrap{max-width:460px;margin:0 auto;display:grid;gap:28px}
.top{display:flex;align-items:center;gap:12px}
.top h1{font-size:18px;margin:0;letter-spacing:.1em;flex:1}
.top button{font:inherit;font-size:13px;color:var(--ink);background:transparent;border:1px solid var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
h2{margin:0 0 10px;font-size:15px;letter-spacing:.12em}
h2 small{font-weight:400;color:var(--muted);letter-spacing:.04em;margin-left:8px}
/* 展開的膠囊（照看板 .ev[open]） */
.cap{--surface:#f6f6f8;--ink:#111114;--muted:#5d5d66;--hair:#dcdce2;background:var(--surface);color:var(--ink);border-radius:24px;padding:18px 20px 20px}
.cap-h{display:flex;align-items:center;gap:12px;font-weight:700;font-size:16px}
.cap-h i{width:9px;height:9px;border-radius:50%;background:#f0bc23}
.times{list-style:none;margin:12px 0 0 2px;padding:0 0 0 12px;border-left:1.5px solid var(--hair);display:grid;gap:4px;font-size:13px}
.times li{position:relative}.times li::before{content:"";position:absolute;left:-16.5px;top:.55em;width:7px;height:7px;border-radius:50%;background:var(--ink)}
.times .num{margin-right:10px}
.arrow{width:12px;height:12px;flex:none}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
a{-webkit-tap-highlight-color:transparent}
/* 現在 */
.now a{display:inline-flex;align-items:center;min-height:32px;padding:3px 12px;border-radius:8px;font-size:13.5px;color:#fff;text-decoration:none;background:var(--c);border:1px solid rgba(127,127,140,.35)}
/* A 細框膠囊＋色點 */
.A a{display:inline-flex;align-items:center;gap:8px;min-height:34px;padding:0 12px 0 11px;border-radius:999px;background:#fff;color:var(--ink);text-decoration:none;font-size:13.5px;font-weight:500;box-shadow:inset 0 0 0 1px var(--hair);transition:transform .2s,box-shadow .2s}
.A a::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.A a .arrow{color:var(--muted)}
.A a:hover{box-shadow:inset 0 0 0 1px var(--ink)}.A a:active{transform:scale(.96)}
/* B 清單列（跟時間標記同一種節奏） */
.B .links{display:grid;gap:0;margin-top:12px;border-top:1px solid var(--hair)}
.B a{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--hair);color:var(--ink);text-decoration:none;font-size:14px;transition:background .2s}
.B a::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.B a span{display:grid;min-width:0}.B a small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.B a .arrow{color:var(--muted)}
.B a:hover{background:rgba(0,0,0,.04)}
/* C 淡色底＋同色字 */
.C a{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 13px;border-radius:999px;background:color-mix(in srgb,var(--c) 13%,#fff);color:color-mix(in srgb,var(--c) 78%,#000);text-decoration:none;font-size:13.5px;font-weight:500;transition:transform .2s,background .2s}
.C a:hover{background:color-mix(in srgb,var(--c) 20%,#fff)}.C a:active{transform:scale(.96)}
</style></head><body>
<div class="wrap">
  <div class="top"><h1>超連結標籤</h1><button type="button" id="th">切換深淺色</button></div>
  <section class="now"><h2>現在<small>色塊方角、白字</small></h2><div class="cap"></div></section>
  <section class="A"><h2>A 細框膠囊<small>白底細框、前面一顆色點、右邊外連箭頭</small></h2><div class="cap"></div></section>
  <section class="B"><h2>B 清單列<small>一個連結一列：色點、名稱、網址小字、箭頭</small></h2><div class="cap"></div></section>
  <section class="C"><h2>C 淡色膠囊<small>選的顏色淡淡鋪底、同色深一點的字</small></h2><div class="cap"></div></section>
</div>
<script>
const L=[["補給站用量","#6a4fd8","docs.google.com/spreadsheets/d/1x…"],["青民協圖片","#3d7fe0","drive.google.com/drive/folders/…"],["投票指南草稿","#e0342a","www.canva.com/design/…"]];
const ar='<svg class="arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M4 2.5h5.5V8M9.3 2.7 2.8 9.2"/></svg>';
document.querySelectorAll("section").forEach(s=>{
  const k=s.className,links=L.map(([n,c,u])=>`<a href="#" style="--c:${c}">${k==="B"?`<span>${n}<small>${u}</small></span>`:n}${k==="now"||k==="C"&&false?"":k==="now"?"":ar}</a>`).join("");
  s.querySelector(".cap").innerHTML=`<div class="cap-h"><i></i>社群內容排程</div><ul class="times"><li><span class="num">11/14</span>回家投票指南發布</li><li><span class="num">11/27</span>回家投票指南限動</li></ul><div class="links">${links}</div>`;
});
document.getElementById("th").onclick=()=>{const r=document.documentElement,d=r.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");r.dataset.theme=d==="dark"?"light":"dark"};
document.addEventListener("click",e=>{if(e.target.closest("a"))e.preventDefault()});
</script>
</body></html>
