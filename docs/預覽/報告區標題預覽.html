<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>報告區標題預覽（第二輪）</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 預覽：即時回報上下兩區的區名（會議報告事項／其他回報）。顏色照看板變數 */
:root{--bg:#000;--ink:#f1f1f4;--muted:#a3a3ae;--hair:#2c2c34;--red:#ff5a4e;--go:#f0bc23}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fff;--ink:#111114;--muted:#5d5d66;--hair:#e2e2e8;--red:#e0342a}}
:root[data-theme="light"]{--bg:#fff;--ink:#111114;--muted:#5d5d66;--hair:#e2e2e8;--red:#e0342a}
:root[data-theme="dark"]{--bg:#000;--ink:#f1f1f4;--muted:#a3a3ae;--hair:#2c2c34;--red:#ff5a4e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Jost","Noto Sans TC",sans-serif;padding:24px 16px 60px}
.wrap{max-width:460px;margin:0 auto;display:grid;gap:34px}
.top{display:flex;align-items:center;gap:12px}.top h1{font-size:18px;margin:0;letter-spacing:.1em;flex:1}
.top button{font:inherit;font-size:13px;color:var(--ink);background:transparent;border:1px solid var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
h2{margin:0 0 14px;font-size:15px;letter-spacing:.12em}h2 small{font-weight:400;color:var(--muted);letter-spacing:.04em;margin-left:8px}
.cap{display:flex;align-items:center;gap:12px;height:48px;padding:0 18px;border-radius:999px;background:#fff;color:#111114;font-weight:700;font-size:15px;margin-bottom:8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.cap i{width:9px;height:9px;border-radius:50%;background:var(--go)}
.zone{margin-bottom:18px}
.num{font-family:"Jost",sans-serif}
/* 現在 */
.now .zh{display:flex;align-items:center;gap:8px;margin:0 0 10px 4px;font-size:12.5px;letter-spacing:.08em;color:var(--muted)}
.now .zh .num{font-size:12px;padding:0 7px;border-radius:999px;border:1px solid currentColor;line-height:17px}
.now .rep .zh{color:var(--red)}
/* 第二輪（使用者：A／B／C 都不好） */
/* D 不寫區名：報告的膠囊右邊直接標「報告」，兩組之間一條細線＋小字 */
.D .rep .zh{display:none}
.D .rep .cap::after{content:"報告";margin-left:auto;font-size:11.5px;font-weight:500;letter-spacing:.14em;color:var(--red)}
.D .rest .zh{display:flex;align-items:center;gap:10px;margin:16px 4px 12px;font-size:11.5px;letter-spacing:.14em;color:var(--muted)}
.D .rest .zh::before,.D .rest .zh::after{content:"";flex:1;height:1px;background:var(--hair)}
.D .rest .zh .num{display:none}
/* E 一組框起來：報告事項整組放進淡紅底大框，框內左上一行標題 */
.E .rep{padding:14px 10px 6px;border-radius:30px;background:color-mix(in srgb,var(--red) 12%,transparent)}
.E .zh{display:flex;align-items:baseline;gap:8px;margin:0 10px 12px;font-size:13px;font-weight:700;letter-spacing:.12em}
.E .zh .num{font-weight:400;color:var(--muted);letter-spacing:0}
.E .rep .zh{color:var(--red)}.E .rep .zh .num{color:var(--red);opacity:.8}
.E .rest .zh{color:var(--muted);font-weight:500;margin-top:6px}
/* F 跟標題列一樣：大一點的粗體區名＋英文小字，不加顏色、不加框；報告區只多一顆紅點 */
.F .zh{display:flex;align-items:baseline;gap:8px;margin:0 4px 12px}
.F .zh b{font-size:15px;font-weight:700!important;letter-spacing:.12em}
.F .zh .num{font-size:13px;color:var(--muted)}
.F .zh .num::before{content:"·  "}
.F .rep .zh b::before{content:"";display:inline-block;width:8px;height:8px;margin:0 8px 2px 0;border-radius:50%;background:var(--red);vertical-align:middle}
.F .rest .zh b{color:var(--muted);font-weight:500!important}
</style></head><body>
<div class="wrap">
  <div class="top"><h1>報告區標題</h1><button type="button" id="th">切換深淺色</button></div>
  <section class="now"><h2>現在<small>紅字＋外框數字</small></h2></section>
  <section class="D"><h2>D 不寫區名<small>報告的膠囊右邊直接寫「報告」，兩組之間細線＋「其他回報」</small></h2></section>
  <section class="E"><h2>E 整組框起來<small>報告事項放進淡紅底大框，框內一行標題</small></h2></section>
  <section class="F"><h2>F 安靜的區名<small>粗體區名＋件數，報告區只多一顆紅點</small></h2></section>
</div>
<script>
const caps=(xs)=>xs.map(t=>`<div class="cap"><i></i>${t}</div>`).join("");
document.querySelectorAll("section").forEach(s=>{
  const z=(cls,name,n,xs)=>`<div class="zone ${cls}"><div class="zh"><b style="font-weight:inherit">${name}</b><span class="num">${n}</span></div>${caps(xs)}</div>`;
  s.insertAdjacentHTML("beforeend",z("rep","會議報告事項",9,["社群內容排程","權益部網站線上化"])+z("rest","其他回報",4,["停車場冷氣機報廢後續"]));
});
document.getElementById("th").onclick=()=>{const r=document.documentElement,d=r.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");r.dataset.theme=d==="dark"?"light":"dark"};
</script>
</body></html>
