<style>
/* 各部門總覽（2026-11-06 第四版）。版面參考使用者給的網頁：導覽列、左邊大標題、右邊一排可以左右拖的卡片、下面箭頭與進度條。
   使用者：卡片整張都是霧面漸層（不要包成一塊）；卡片列兩端淡出、不要硬切；拖起來要流暢、Q 彈；點下去要有過渡；會長室／秘書處不要在三個地方重複。
   App 打開：學生會開場動畫（core/js/splash.js）→ 這一頁。卡片內容都是固定文字，大小固定。自成一頁，不載入看板程式 */
:root{--bg:#efefef;--ink:#141416;--muted:#77777f;--hair:#d6d6da;--pill:#e4e4e7;--ease:cubic-bezier(.2,.9,.25,1);--spring:cubic-bezier(.34,1.5,.5,1);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#050506;--ink:#f1f1f4;--muted:#8d8d96;--hair:#2a2a30;--pill:#1b1b1f;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--ink);font-family:"Jost","Noto Sans TC",system-ui,"PingFang TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}   /* 數字、英文用 Jost（跟看板一致），中文落到 Noto Sans TC */
body{overflow-x:hidden}
a{color:inherit}
.page{position:relative;min-height:100vh;min-height:100dvh;max-width:1240px;margin:0 auto;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));overflow:hidden}
/* 右上角淡淡的點狀圓球（裝飾） */
.dots{position:absolute;right:-60px;top:70px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,currentColor 1.1px,transparent 1.6px) 0 0/9px 9px;color:var(--muted);opacity:.26;-webkit-mask:radial-gradient(circle,#000 0 38%,transparent 70%);mask:radial-gradient(circle,#000 0 38%,transparent 70%);pointer-events:none}
/* --- 導覽列：左邊學生會標誌＋STUSTSA、右邊日期膠囊 --- */
.bar{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;letter-spacing:.08em;text-decoration:none}
.hm-svg{display:block;width:26px;height:auto}
.mk-under{fill:var(--bg)}
.mk-gap{fill:none;stroke:var(--bg);stroke-width:4;stroke-linejoin:round;display:none}   /* 深色時兩塊同色：藍色那個小人整圈描一圈底色當切割線（外圍那段跟背景同色看不見） */
@media (prefers-color-scheme:dark){.hm-svg .mk-y,.hm-svg .mk-b{fill:var(--ink)}.hm-svg .mk-gap{display:inline}}
.date{display:flex;align-items:center;padding:9px 16px;border-radius:999px;background:var(--pill);font-size:12.5px;letter-spacing:.06em;white-space:nowrap}
/* --- 主區：大標題、左欄說明、右邊卡片列 --- */
.main{position:relative;z-index:1;flex:1;display:grid;grid-template-columns:minmax(180px,230px) minmax(0,1fr);grid-template-rows:auto 1fr;gap:28px 24px;padding-top:clamp(36px,8vh,90px)}
h1{grid-column:1/-1;margin:0;display:flex;align-items:center;gap:14px;font-size:clamp(34px,5.4vw,60px);font-weight:700;letter-spacing:.04em;line-height:1.05}
h1 svg{width:.62em;height:.62em;flex:none}
.note{align-self:end;margin:0;font-size:13px;line-height:1.7;color:var(--muted)}
.note b{display:block;margin-bottom:6px;font-size:28px;font-weight:300;color:var(--ink);letter-spacing:.02em}
/* 卡片列：自己做的拖曳（程式 rail）。.view 裁掉超出的部分、兩端淡出（左邊只在往左拖過之後淡）；.belt 整排用 transform 移動 */
.rail{min-width:0;display:flex;flex-direction:column;gap:18px}
.view{--fl:0px;position:relative;overflow:hidden;margin:-30px calc(-1*max(20px,env(safe-area-inset-right))) -30px -6px;padding:30px max(20px,env(safe-area-inset-right)) 30px 6px;touch-action:pan-y;cursor:grab;
  -webkit-mask:linear-gradient(90deg,transparent 0,#000 var(--fl),#000 calc(100% - 90px),transparent 100%);mask:linear-gradient(90deg,transparent 0,#000 var(--fl),#000 calc(100% - 90px),transparent 100%)}
.view.drag{cursor:grabbing}
.belt{--sq:0;--sk:0;display:flex;gap:14px;width:max-content;will-change:transform}   /* --sq／--sk 寫在整排上、卡片繼承（拖曳時每格只寫一次） */
/* 卡片：整張都是霧面漸層（三色：亮 --g1、中 --g2、暗 --g3，兩團大光暈錯開），字直接放在上面 */
.card{--g1:#bcc7be;--g2:#9aa48c;--g3:#323d2e;position:relative;flex:none;width:clamp(236px,24vw,282px);height:360px;display:flex;flex-direction:column;padding:20px 20px 18px;border-radius:26px;overflow:hidden;color:#fff;text-decoration:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none;
  background:radial-gradient(120% 80% at 10% 0%,var(--g1) 0%,transparent 60%),radial-gradient(130% 90% at 90% 100%,var(--g3) 0%,transparent 72%),linear-gradient(165deg,var(--g1) 0%,var(--g2) 46%,var(--g3) 100%);
  box-shadow:0 12px 22px -16px color-mix(in srgb,var(--g3) 75%,transparent);   /* 陰影不能超出卡片列的留白（30px），不然會被裁出一塊方形的影子 */
  transform:scale(calc(1 - var(--sq) * .035)) skewX(calc(var(--sk) * 1deg));scale:1;transition:scale .5s var(--spring),box-shadow .3s var(--ease);
  will-change:transform}   /* 每張卡片自己一層：拖曳時的微縮、斜一點只在顯示卡上變形，漸層不用每格重畫（2026-11-06 使用者：手機滑動很卡） */
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.26));pointer-events:none}   /* 下半部壓暗一點：字都放在下半部，白字看得清楚（上半部漸層最亮，放字會看不清） */
.card>*{position:relative;z-index:1}
.card .en{font-size:10.5px;letter-spacing:.26em;opacity:.85;text-shadow:0 1px 10px rgba(0,0,0,.2)}
.card .en{margin-top:auto}
.card b{margin-top:6px;font-size:28px;font-weight:700;letter-spacing:.1em;line-height:1.1;text-shadow:0 2px 16px rgba(0,0,0,.2)}
.card .dash{width:22px;height:1.5px;margin:14px 0 10px;background:#fff;opacity:.75}
.card p{margin:0;font-size:13px;line-height:1.6;opacity:.9;min-height:3.2em}
.card .go{position:absolute;top:16px;right:16px;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.24);transition:background-color .25s,color .25s}
.card .go svg{width:14px;height:14px;transition:transform .35s var(--spring)}
.card:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media (hover:hover){.card:hover .go{background:#fff;color:var(--g3)}.card:hover .go svg{transform:translate(2px,-2px)}}
/* 按下：Q 彈縮一下（放開用彈簧曲線彈回） */
.card.press{scale:.96;transition:scale .18s var(--ease),box-shadow .3s var(--ease)}
/* 每個部門一組霧面漸層 */
.card[data-g="president"]{--g1:#d9d9de;--g2:#6d6d78;--g3:#1d1d22}
.card[data-g="secretariat"]{--g1:#e3e9f2;--g2:#8fa3c2;--g3:#1f2f4a}
.card[data-g="rights"]{--g1:#f7f2ec;--g2:#edba8d;--g3:#59361e}
.card[data-g="marketing"]{--g1:#f3e6e6;--g2:#d9a3a8;--g3:#5a2d3a}
.card[data-g="finance"]{--g1:#bcc7be;--g2:#9aa48c;--g3:#323d2e}
.card[data-g="events"]{--g1:#e9e6f2;--g2:#a9a2c9;--g3:#3b3557}
.card[data-g="affairs"]{--g1:#d2ecf2;--g2:#09606d;--g3:#075057}
.card[data-g="pr"]{--g1:#f6ece6;--g2:#e7a98f;--g3:#6b3a2e}
.card[data-g="works"]{--g1:#e3e5e3;--g2:#a7adab;--g3:#3f4447}
/* 卡片下面：左右箭頭、進度條（目前在第幾段，實線較長） */
.ctl{display:flex;align-items:center;justify-content:space-between;gap:12px}
.arrows{display:flex;gap:6px}
.arrows button{display:grid;place-items:center;width:36px;height:36px;padding:0;border:0;border-radius:50%;background:transparent;color:var(--ink);cursor:pointer;transition:opacity .2s,background-color .2s,scale .4s var(--spring)}
.arrows button:active{scale:.88}
.arrows button:disabled{opacity:.3;cursor:default}
@media (hover:hover){.arrows button:not(:disabled):hover{background:var(--pill)}}
.arrows svg{width:18px;height:18px}
/* 進度條：一條細軌道，上面一段實線＝目前看得到的範圍（長度＝看得到的比例，跟著拖曳移動），部門再多也放得下 */
.prog{position:relative;width:min(180px,40vw);height:1.5px;background:var(--hair);overflow:hidden}
.prog i{position:absolute;left:0;top:0;bottom:0;width:var(--pw,30%);background:var(--ink);transform:translateX(var(--px,0%));will-change:transform}
.foot{position:relative;z-index:1;margin:22px 0 0;font-size:11px;letter-spacing:.14em;color:var(--muted)}
/* 進場：大標題由下往上、卡片從右邊 Q 彈滑進來（減少動態時不動） */
h1,.note{animation:rise .7s var(--ease) both}
.note{animation-delay:.08s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.card{animation:cardIn .8s var(--spring) both;animation-delay:calc(var(--i,0) * 60ms + 120ms)}
@keyframes cardIn{from{opacity:0;translate:60px 0}}
@media (max-width:760px){
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto;gap:16px;padding-top:30px}
  .note{order:3}
  .card{width:min(74vw,280px);height:340px}
  .view{margin-left:calc(-1*max(20px,env(safe-area-inset-left)));padding-left:max(20px,env(safe-area-inset-left))}
  .dots{width:300px;height:300px;right:-120px;top:110px}
}
.pfx-arrive body{opacity:0}
@media (prefers-reduced-motion:reduce){h1,.note,.card{animation:none}.card,.prog i{transition:none}}
</style>

<script>/* 安裝成 App：總覽頁也要註冊 Service Worker（跟看板同一個 sw.js），才能從這一頁安裝、離線打開 */if("serviceWorker" in navigator&&(location.protocol==="https:"||/^(localhost|127\.0\.0\.1)$/.test(location.hostname)))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>

<script>
(()=>{
  const D=window.BOARD_DEPTS||[],$=id=>document.getElementById(id),RM=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const href=d=>d.id==="rights"?"index.html":`index.html?d=${encodeURIComponent(d.id)}`;
  /* 卡片上的固定文字：英文小字、一句說明（不放會跟著資料變的數字） */
  const EN={president:"PRESIDENT",secretariat:"SECRETARIAT",rights:"STUDENT RIGHTS",marketing:"MARKETING",finance:"FINANCE",events:"EVENTS",affairs:"CLUB AFFAIRS",pr:"PUBLIC RELATIONS",works:"FACILITIES"};
  const TXT={president:"追蹤各部門的議題，開放秘書處的會議編輯。",secretariat:"整理各部門的會議報告事項，調閱每週概述。",rights:"學生權益議題的處理進度與即時回報。",marketing:"宣傳、社群內容的排程與進度。",finance:"經費、帳務與核銷的處理進度。",events:"活動籌備、場地與時程的進度。",affairs:"社團事務與相關議題的處理進度。",pr:"對外聯繫、合作與公關事務的進度。",works:"設備、場地維護與工務事項的進度。"};
  const ARROW=`<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 11.5 11.5 4.5M5.5 4.5h6v6"/></svg>`;
  const order=[...D.filter(d=>d.id==="president"||d.id==="secretariat"),...D.filter(d=>d.id!=="president"&&d.id!=="secretariat")];   /* 會長室、秘書處排最前面 */
  const belt=$("belt"),view=$("view");
  belt.innerHTML=order.map((d,i)=>`<a class="card" data-g="${esc(d.id)}" href="${href(d)}" style="--i:${i}" draggable="false"><span class="en">${EN[d.id]||esc(d.id).toUpperCase()}</span><b>${esc(d.name)}</b><span class="dash"></span><p>${TXT[d.id]||`${esc(d.name)}的工作進度。`}</p><span class="go">${ARROW}</span></a>`).join("");
  $("cnt").textContent=String(order.length).padStart(2,"0");
  {const t=new Date(),W="日一二三四五六";$("todayTxt").textContent=`${String(t.getMonth()+1).padStart(2,"0")}.${String(t.getDate()).padStart(2,"0")} 週${W[t.getDay()]}`}

  /* ---------- 卡片列：拖曳＋慣性＋彈簧（Q 彈） ----------
     x＝整排往左移了多少（0～-max）。拖的時候跟著手指；超出兩端像橡皮筋（越拉越緊）。
     放開：照放開的速度往前滑一段，停在最近的一張卡片開頭；用彈簧（會稍微甩過頭再彈回來）。箭頭、滾輪也是設目標、交給彈簧。
     移動越快，卡片微微縮小、往移動方向斜一點（--sq、--sk），停下來彈回原狀。只動 transform，手機也順 */
  const cards=[...belt.children];let x=0,v=0,target=0,raf=0,drag=null,moved=false;
  /* 尺寸只在載入、改變視窗大小時量一次（M），拖曳中每格只寫樣式、不讀版面，不會每格被迫重排（2026-11-06 使用者：手機滑動很卡） */
  const gap=14,FADE=90;   /* 右邊 90px 是淡出區：最後一張要停在淡出區左邊、整張看得到 */
  const M={w:0,vis:0,max:0,tot:1};
  const measure=()=>{M.w=cards[0].getBoundingClientRect().width+gap;M.vis=view.clientWidth-(parseFloat(getComputedStyle(view).paddingLeft)||0)-FADE;M.tot=belt.scrollWidth||1;M.max=Math.max(0,M.tot-M.vis)};
  const cw=()=>M.w,visW=()=>M.vis,maxX=()=>M.max;
  const snap=t=>{const w=cw(),m=maxX();return Math.max(-m,Math.min(0,Math.round(t/w)*w))};
  const rubber=(t,m)=>t>0?t*.35/(1+t/400):t<-m?-m+(t+m)*.35/(1+(-m-t)/400):t;
  let pSq="",pSk="",pFl="";
  function paint(){belt.style.transform=`translate3d(${x.toFixed(2)}px,0,0)`;
    const sq=Math.min(1,Math.abs(v)/2600).toFixed(3),sk=(Math.max(-1,Math.min(1,-v/2600))*2.2).toFixed(2),fl=x<-4?"70px":"0px";
    if(sq!==pSq)belt.style.setProperty("--sq",pSq=sq);if(sk!==pSk)belt.style.setProperty("--sk",pSk=sk);if(fl!==pFl)view.style.setProperty("--fl",pFl=fl);
    sync()}
  let last=0;
  function step(now){
    const dt=Math.min(.032,(now-(last||now))/1000)||.016;last=now;
    const k=210,c=20;const a=-k*(x-target)-c*v;v+=a*dt;x+=v*dt;   /* 彈簧：勁度 210、阻尼 20（略帶回彈） */
    if(Math.abs(x-target)<.3&&Math.abs(v)<4){x=target;v=0;paint();raf=0;last=0;return}
    paint();raf=requestAnimationFrame(step);
  }
  const go=t=>{target=t;if(RM()){x=t;v=0;paint();return}if(!raf){last=0;raf=requestAnimationFrame(step)}};
  /* 拖曳（滑鼠、觸控都用 pointer；直向的滑動交給頁面捲動） */
  view.addEventListener("pointerdown",e=>{if(e.button>0)return;cancelAnimationFrame(raf);raf=0;drag={id:e.pointerId,x0:e.clientX,y0:e.clientY,start:x,t:performance.now(),lx:e.clientX,lt:performance.now(),axis:""};moved=false;
    const c=e.target.closest(".card");if(c){drag.card=c;c.classList.add("press")}});
  addEventListener("pointermove",e=>{if(!drag||e.pointerId!==drag.id)return;const dx=e.clientX-drag.x0,dy=e.clientY-drag.y0;
    if(!drag.axis){if(Math.hypot(dx,dy)<6)return;drag.axis=Math.abs(dx)>Math.abs(dy)?"x":"y";if(drag.axis==="y"){drag.card&&drag.card.classList.remove("press");drag=null;return}
      moved=true;view.classList.add("drag");try{view.setPointerCapture(e.pointerId)}catch(_){}drag.card&&drag.card.classList.remove("press")}
    const now=performance.now(),m=maxX();x=rubber(drag.start+dx,m);v=(e.clientX-drag.lx)/Math.max(1,now-drag.lt)*1000*.8+v*.2;drag.lx=e.clientX;drag.lt=now;target=x;
    if(!dragRaf)dragRaf=requestAnimationFrame(()=>{dragRaf=0;paint()})});   /* 手指移動的事件一格可能來好幾次：合併成每格畫一次 */
  let dragRaf=0;
  const up=e=>{if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;view.classList.remove("drag");d.card&&d.card.classList.remove("press");
    if(!moved)return;const proj=x+v*.22;go(snap(proj))};
  addEventListener("pointerup",up);addEventListener("pointercancel",up);
  view.addEventListener("click",e=>{if(moved){e.preventDefault();e.stopPropagation();moved=false}},true);   /* 拖完放開的那一下不是點擊 */
  /* 滾輪（直的、橫的都換成左右）：累加到目標，交給彈簧 */
  let wt=0;view.addEventListener("wheel",e=>{const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY,m=maxX();if(!m)return;
    if((d<0&&target>=0)||(d>0&&target<=-m))return;e.preventDefault();target=Math.max(-m,Math.min(0,target-d));go(target);clearTimeout(wt);wt=setTimeout(()=>go(snap(target)),140)},{passive:false});
  /* 箭頭：一次換一個畫面寬（整張整張） */
  const page=dir=>{const w=cw(),per=Math.max(1,Math.floor((visW()+gap)/w));go(snap(target-dir*per*w))};
  $("prev").onclick=()=>page(-1);$("next").onclick=()=>page(1);
  /* 鍵盤：Tab 到某張卡片時，捲到看得到 */
  belt.addEventListener("focusin",e=>{const c=e.target.closest(".card");if(!c)return;view.scrollLeft=0;const i=cards.indexOf(c),w=cw(),vis=visW();const l=i*w;if(l+x<0||l+w+x>vis)go(snap(-l))});
  /* 進度條、箭頭狀態 */
  const prog=$("prog");
  let pPw="",pPx="",pPrev=null,pNext=null;
  function sync(){const m=maxX(),tot=M.tot,pw=Math.min(1,visW()/tot),f=m<1?0:Math.max(-.08,Math.min(1.08,-x/m));   /* 拖過頭時實線也跟著微微超出（橡皮筋） */
    const a=(pw*100).toFixed(1)+"%",b=(f*(1-pw)/pw*100).toFixed(1)+"%",dp=target>=-1,dn=target<=-m+1;
    if(a!==pPw)prog.style.setProperty("--pw",pPw=a);if(b!==pPx)prog.style.setProperty("--px",pPx=b);
    if(dp!==pPrev)$("prev").disabled=pPrev=dp;if(dn!==pNext)$("next").disabled=pNext=dn}
  addEventListener("resize",()=>{measure();const m=maxX();target=Math.max(-m,Math.min(0,target));x=target;paint()});
  measure();paint();
  if(document.fonts)document.fonts.ready.then(()=>{measure();paint()});   /* 字型載入後卡片寬度可能變：再量一次 */

  /* ---------- 點卡片進部門：這一頁自己的離場動畫（只動 transform／opacity，交給顯示卡），播完才換頁；看板那邊從後面浮上來（pagefx.js） ----------
     點到的那張往前放大一點、其他卡片往兩邊滑開淡出、標題與其他字往上淡出，整頁最後往後退一點淡掉 */
  belt.addEventListener("click",e=>{
    const c=e.target.closest(".card");if(!c||e.defaultPrevented||e.metaKey||e.ctrlKey||e.shiftKey||e.button)return;
    e.preventDefault();e.stopPropagation();const u=c.href;
    if(RM()){location.href=u;return}
    const E={duration:420,easing:"cubic-bezier(.5,0,.75,0)",fill:"forwards"},i=cards.indexOf(c);
    c.animate([{transform:"scale(1)"},{transform:"scale(1.06)",offset:.45},{transform:"scale(1.02)",opacity:0}],{duration:460,easing:"cubic-bezier(.3,0,.4,1)",fill:"forwards"});
    cards.forEach((o,j)=>{if(o!==c)o.animate([{opacity:1,translate:"0 0"},{opacity:0,translate:`${j<i?-40:40}px 0`}],{...E,duration:340,delay:Math.abs(j-i)*25})});
    document.querySelectorAll(".bar,h1,.note,.ctl,.foot,.dots").forEach(el=>el.animate([{opacity:1,transform:"none"},{opacity:0,transform:"translateY(-10px)"}],{...E,duration:300}));
    $("page").animate([{transform:"none",opacity:1},{transform:"scale(.97)",opacity:0}],{duration:240,delay:300,easing:"cubic-bezier(.4,0,1,1)",fill:"forwards"}).onfinish=()=>{location.href=u};
  });
  addEventListener("pageshow",e=>{if(e.persisted)document.querySelectorAll("*").forEach(el=>el.getAnimations&&el.getAnimations().forEach(a=>{if(a.playState==="finished"&&a.effect&&a.effect.getTiming().fill==="forwards")a.cancel()}))});   /* 從看板按返回回到快取的這一頁：把離場動畫留下的狀態清掉 */
  splashOut();   /* 開場動畫播完（字型好了、至少 0.6 秒）才淡出（core/js/splash.js） */
})();
</script>
</body>
</html>
