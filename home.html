<style>
/* 各部門總覽（2026-11-06 使用者第二版：「按住標誌拖到部門」那一套拿掉，每個部門都是一張卡片，點了進那個部門）。
   App 打開：學生會開場動畫（core/js/splash.js）→ 這一頁。進部門的轉場跟看板裡切換大頁面一樣（core/js/pagefx.js：這一頁往後退、模糊，看板從後面浮上來）。
   卡片只放固定的內容（英文小字、名稱、開啟 →），大小固定，不放會跟著資料變的數字（使用者：不喜歡載入前後大小變化）。自成一頁，不載入看板程式 */
:root{--bg:#fff;--ink:#111114;--muted:#5d5d66;--hair:#e2e2e8;--card:#f4f4f6;--ease:cubic-bezier(.2,.9,.25,1);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#000;--ink:#f1f1f4;--muted:#a3a3ae;--hair:#2c2c34;--card:#141417;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--ink);font-family:"Jost","Noto Sans TC",system-ui,"PingFang TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}   /* 數字、英文用 Jost（跟看板一致），中文落到 Noto Sans TC */
body{overflow-x:hidden}
.wrap{min-height:100vh;min-height:100dvh;max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding:calc(22px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
/* --- 頁首：學生會標誌（小）＋ WORK BOARDS --- */
.top{display:grid;justify-items:center;gap:10px;padding:6px 0 10px}
.hm-svg{display:block;width:46px;height:auto}
.mk-under{fill:var(--bg)}
.mk-gap{fill:none;stroke:var(--bg);stroke-width:7;stroke-linejoin:round;display:none}   /* 深色時兩塊同色：兩個小人重疊的地方描一條底色切割線（clip-path #hmCut，外圍不描框） */
@media (prefers-color-scheme:dark){.hm-svg .mk-y,.hm-svg .mk-b{fill:var(--ink)}.hm-svg .mk-gap{display:inline}}
.eyebrow{margin:0;font-size:12px;letter-spacing:.24em;color:var(--muted)}
/* --- 卡片：會長室、秘書處兩張大的在上面，其他部門一張一張排在下面；每個部門一個顏色（--c） --- */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{--c:var(--card);--on:var(--ink);position:relative;overflow:hidden;display:grid;align-content:space-between;gap:14px;height:150px;padding:18px 18px 16px;border-radius:26px;background:var(--c);color:var(--on);text-decoration:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.card.lead{height:168px}
.card .en{display:block;font-size:10.5px;letter-spacing:.26em;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card b{display:block;margin-top:4px;font-size:24px;font-weight:700;letter-spacing:.12em;line-height:1.15}
.card.lead b{font-size:26px}
.card .sub{display:block;margin-top:8px;font-size:12px;letter-spacing:.06em;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .go{display:flex;justify-content:flex-end;align-items:center;padding-top:10px;border-top:1px solid color-mix(in srgb,currentColor 18%,transparent);font-size:11.5px;opacity:.8}
.card .go span{transition:transform .25s var(--ease)}
.card .deco{position:absolute;right:-34px;top:-34px;width:120px;height:120px;border-radius:50%;border:1px solid color-mix(in srgb,currentColor 18%,transparent);pointer-events:none}
.card:active{transform:scale(.97)}
.card:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media (hover:hover){.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px -14px color-mix(in srgb,var(--c) 70%,transparent)}.card:hover .go span{transform:translateX(4px)}}
/* 顏色：會長室反白（文字色底）、秘書處淡灰；其他部門各一個沉穩的顏色、白字（深淺色模式都一樣） */
.card.pres{--c:var(--ink);--on:var(--bg)}
.card[data-c]{--on:#fff}
.card[data-c="rights"]{--c:#c7402f}
.card[data-c="marketing"]{--c:#d27a1f}
.card[data-c="finance"]{--c:#23866a}
.card[data-c="events"]{--c:#6a4fd0}
.card[data-c="affairs"]{--c:#2a69b3}
.card[data-c="pr"]{--c:#c13d78}
.card[data-c="works"]{--c:#5f6d2a}
.card[data-c="other"]{--c:#4a4a55}
/* 進場：卡片由下往上依序浮現（只在開場畫面收掉後或站內換頁到達後；減少動態時不動） */
.card{animation:cardIn .55s var(--ease) both;animation-delay:calc(var(--i,0) * 45ms + 80ms)}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}}
.foot{margin:auto 0 0;padding-top:18px;text-align:center;font-size:11px;letter-spacing:.14em;color:var(--muted)}
@media (min-width:700px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid.leads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{height:170px;padding:22px}
  .card.lead{height:200px}
  .card.lead b{font-size:30px}
}
.pfx-arrive body{opacity:0}
@media (prefers-reduced-motion:reduce){.card{animation:none;transition:none}}
</style>
<script>/* 換頁動畫（core/js/pagefx.js）：從站內換頁過來的，body 先透明，等它從後面浮上來（不會先閃一下完整的畫面） */try{var r=document.referrer,n=performance.getEntriesByType("navigation")[0];if(r&&new URL(r).origin===location.origin&&(!n||n.type!=="reload")&&!matchMedia("(prefers-reduced-motion: reduce)").matches)document.documentElement.classList.add("pfx-arrive")}catch(e){}</script>
</head>
<body>

,0,1,134,126.44Z"/></svg><p class="eyebrow">WORK&nbsp;&nbsp;BOARDS</p></header>
  <nav class="grid leads" id="leads" aria-label="會長室與秘書處"></nav>
  <nav class="grid" id="depts" aria-label="各部門"></nav>

<script>/* 安裝成 App：總覽頁也要註冊 Service Worker（跟看板同一個 sw.js），才能從這一頁安裝、離線打開 */if("serviceWorker" in navigator&&(location.protocol==="https:"||/^(localhost|127\.0\.0\.1)$/.test(location.hostname)))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
<script src="dept/config.js"></script>
<script>
(()=>{
  const D=window.BOARD_DEPTS||[],$=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const href=d=>d.id==="rights"?"index.html":`index.html?d=${encodeURIComponent(d.id)}`;
  /* 卡片上的英文小字、會長室與秘書處的一行說明（固定文字，不放會變的數字） */
  const EN={president:"PRESIDENT",secretariat:"SECRETARIAT",rights:"STUDENT RIGHTS",marketing:"MARKETING",finance:"FINANCE",events:"EVENTS",affairs:"CLUB AFFAIRS",pr:"PUBLIC RELATIONS",works:"FACILITIES"};
  const SUB={president:"追蹤各部門・開放會議編輯",secretariat:"會議報告事項・各部門週報"};
  const COLOR=new Set(["rights","marketing","finance","events","affairs","pr","works"]);
  const leadIds=["president","secretariat"];
  const card=(d,i)=>`<a class="card${leadIds.includes(d.id)?" lead":""}${d.id==="president"?" pres":""}"${leadIds.includes(d.id)?"":` data-c="${COLOR.has(d.id)?d.id:"other"}"`} href="${href(d)}" style="--i:${i}"><span class="deco" aria-hidden="true"></span><span><span class="en">${EN[d.id]||d.id.toUpperCase()}</span><b>${esc(d.name)}</b>${SUB[d.id]?`<span class="sub">${SUB[d.id]}</span>`:""}</span><span class="go"><span>開啟 →</span></span></a>`;
  const leads=leadIds.map(id=>D.find(d=>d.id===id)).filter(Boolean),rest=D.filter(d=>!leadIds.includes(d.id));
  $("leads").innerHTML=leads.map(card).join("");
  $("depts").innerHTML=rest.map((d,i)=>card(d,i+leads.length)).join("");
  /* 點卡片換頁：pagefx.js 會攔下站內連結，這一頁往後退（模糊）再換頁，看板從後面浮上來 */
  splashOut();   /* 開場動畫播完（字型好了、至少 0.6 秒）才淡出（core/js/splash.js） */
})();
</script>
