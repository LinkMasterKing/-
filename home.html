<style>
/* 各部門總覽（2026-11-06 第三版，使用者給的參考：淺色版面、上方導覽列、左邊大標題、右邊一排可以左右滑的白色圓角卡片、下面箭頭與進度條；
   部門顏色參考霧面漸層（綠、沙漠、海那種柔和的多層漸層），每個部門一組）。App 打開：學生會開場動畫（core/js/splash.js）→ 這一頁。
   卡片內容都是固定文字，大小固定。點卡片進部門＝跟看板裡切換大頁面一樣的轉場（core/js/pagefx.js）。自成一頁，不載入看板程式 */
:root{--bg:#efefef;--panel:#f6f6f6;--card:#fff;--ink:#141416;--muted:#77777f;--hair:#dcdcdf;--pill:#e7e7e9;--ease:cubic-bezier(.2,.9,.25,1);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#050506;--panel:#0d0d0f;--card:#17171a;--ink:#f1f1f4;--muted:#8d8d96;--hair:#2a2a30;--pill:#1d1d21;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--ink);font-family:"Jost","Noto Sans TC",system-ui,"PingFang TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}   /* 數字、英文用 Jost（跟看板一致），中文落到 Noto Sans TC */
body{overflow-x:hidden}
a{color:inherit}
.page{position:relative;min-height:100vh;min-height:100dvh;max-width:1240px;margin:0 auto;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));overflow:hidden}
/* 右上角淡淡的點狀圓球（裝飾） */
.dots{position:absolute;right:-60px;top:70px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,currentColor 1.1px,transparent 1.6px) 0 0/9px 9px;color:var(--muted);opacity:.28;-webkit-mask:radial-gradient(circle,#000 0 38%,transparent 70%);mask:radial-gradient(circle,#000 0 38%,transparent 70%);pointer-events:none}
/* --- 導覽列：左邊膠囊（目前在「部門」）、中間學生會標誌、右邊日期膠囊 --- */
.bar{position:relative;z-index:1;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.seg{justify-self:start;display:flex;gap:2px;padding:4px;border-radius:999px;background:var(--pill)}
.seg a{padding:7px 14px;border-radius:999px;font-size:13px;color:var(--muted);text-decoration:none;white-space:nowrap;transition:color .2s,background-color .2s}
.seg a[aria-current]{background:var(--card);color:var(--ink);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.06)}
@media (hover:hover){.seg a:not([aria-current]):hover{color:var(--ink)}}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;letter-spacing:.08em;text-decoration:none}
.hm-svg{display:block;width:26px;height:auto}
.mk-under{fill:var(--bg)}
.mk-gap{fill:none;stroke:var(--bg);stroke-width:4;stroke-linejoin:round;display:none}   /* 深色時兩塊同色：兩個小人重疊的地方描一條細的底色切割線（clip-path #hmCut，外圍不描框） */
@media (prefers-color-scheme:dark){.hm-svg .mk-y,.hm-svg .mk-b{fill:var(--ink)}.hm-svg .mk-gap{display:inline}}
.date{justify-self:end;display:flex;align-items:center;padding:9px 16px;border-radius:999px;background:var(--pill);font-size:12.5px;letter-spacing:.06em;white-space:nowrap}
/* --- 主區：左欄（大標題、兩顆外框膠囊、左下說明）＋右邊卡片列 --- */
.main{position:relative;z-index:1;flex:1;display:grid;grid-template-columns:minmax(200px,250px) minmax(0,1fr);grid-template-rows:auto 1fr;gap:26px 24px;padding-top:clamp(36px,8vh,90px)}
h1{grid-column:1/-1;margin:0;display:flex;align-items:center;gap:14px;font-size:clamp(34px,5.4vw,60px);font-weight:700;letter-spacing:.04em;line-height:1.05}
h1 svg{width:.62em;height:.62em;flex:none}
.side{display:flex;flex-direction:column;gap:10px;min-width:0}
.ghost{display:flex;align-items:center;justify-content:space-between;gap:12px;width:max-content;min-width:150px;padding:9px 12px 9px 16px;border:1.5px solid var(--ink);border-radius:999px;font-size:13px;text-decoration:none;transition:background-color .2s,color .2s}
.ghost svg{width:14px;height:14px;transition:transform .25s var(--ease)}
@media (hover:hover){.ghost:hover{background:var(--ink);color:var(--bg)}.ghost:hover svg{transform:translate(2px,-2px)}}
.note{margin:auto 0 0;padding-top:24px;font-size:13px;line-height:1.6;color:var(--muted);max-width:200px}
/* 卡片列：橫向捲動、一張一張吸附；右邊超出畫面（看得到下一張的一小截）。滑鼠滾輪直的也能換（程式） */
.rail{min-width:0;display:flex;flex-direction:column;gap:18px}
.track{display:flex;gap:14px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scroll-padding-left:2px;padding:2px 2px 6px;margin-right:calc(-1*max(20px,env(safe-area-inset-right)));padding-right:max(20px,env(safe-area-inset-right));scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.card{--g1:#bcc7be;--g2:#9aa48c;--g3:#323d2e;flex:none;scroll-snap-align:start;width:clamp(232px,24vw,282px);height:360px;display:flex;flex-direction:column;padding:12px 12px 16px;border-radius:24px;background:var(--card);color:var(--ink);text-decoration:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .3s var(--ease),box-shadow .3s var(--ease);animation:cardIn .6s var(--ease) both;animation-delay:calc(var(--i,0) * 50ms + 80ms)}
@keyframes cardIn{from{opacity:0;transform:translateX(26px)}}
/* 漸層色塊：三個顏色疊成柔和的霧面漸層（亮的在上、暗的在下，兩團大光暈錯開） */
.tile{position:relative;height:150px;border-radius:16px;overflow:hidden;padding:12px 14px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;color:#fff;
  background:radial-gradient(120% 85% at 15% 0%,var(--g1) 0%,transparent 62%),radial-gradient(110% 90% at 85% 100%,var(--g3) 0%,transparent 70%),linear-gradient(170deg,var(--g1) 0%,var(--g2) 48%,var(--g3) 100%)}
.tile .en{font-size:10px;letter-spacing:.24em;opacity:.85;text-shadow:0 1px 8px rgba(0,0,0,.25)}   /* 英文小字跟名稱一起放在下面（漸層下半部比較暗，白字看得清楚） */
.tile b{font-size:24px;font-weight:700;letter-spacing:.1em;text-shadow:0 2px 14px rgba(0,0,0,.22)}
.card .dash{width:22px;height:1.5px;margin:auto 4px 12px;background:var(--ink);opacity:.6}
.card p{margin:0 4px;font-size:13px;line-height:1.6;color:var(--muted);min-height:4.8em}
.card .go{margin:14px 4px 0;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--pill);transition:background-color .2s,color .2s,transform .3s var(--ease)}
.card .go svg{width:14px;height:14px}
.card:active{transform:scale(.97)}
.card:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media (hover:hover){.card:hover{transform:translateY(-4px);box-shadow:0 18px 40px -22px rgba(0,0,0,.35)}.card:hover .go{background:var(--ink);color:var(--card);transform:rotate(-45deg)}}
/* 每個部門一組霧面漸層（亮 --g1、中 --g2、暗 --g3） */
.card[data-g="president"]{--g1:#d9d9de;--g2:#6d6d78;--g3:#1d1d22}
.card[data-g="secretariat"]{--g1:#e3e9f2;--g2:#8fa3c2;--g3:#1f2f4a}
.card[data-g="rights"]{--g1:#f7f7f7;--g2:#edba8d;--g3:#59361e}
.card[data-g="marketing"]{--g1:#f3e6e6;--g2:#d9a3a8;--g3:#5a2d3a}
.card[data-g="finance"]{--g1:#bcc7be;--g2:#9aa48c;--g3:#323d2e}
.card[data-g="events"]{--g1:#e9e6f2;--g2:#a9a2c9;--g3:#3b3557}
.card[data-g="affairs"]{--g1:#d2ecf2;--g2:#09606d;--g3:#075057}
.card[data-g="pr"]{--g1:#f6ece6;--g2:#e7a98f;--g3:#6b3a2e}
.card[data-g="works"]{--g1:#e3e5e3;--g2:#a7adab;--g3:#3f4447}
/* 卡片下面：左右箭頭、進度條（目前在第幾段，實線較長） */
.ctl{display:flex;align-items:center;justify-content:space-between;gap:12px}
.arrows{display:flex;gap:6px}
.arrows button{display:grid;place-items:center;width:34px;height:34px;padding:0;border:0;border-radius:50%;background:transparent;color:var(--ink);cursor:pointer;transition:opacity .2s,background-color .2s}
.arrows button:disabled{opacity:.3;cursor:default}
@media (hover:hover){.arrows button:not(:disabled):hover{background:var(--pill)}}
.arrows svg{width:18px;height:18px}
.prog{display:flex;gap:8px}
.prog i{display:block;width:28px;height:1.5px;background:var(--hair);transition:width .35s var(--ease),background-color .35s}
.prog i.on{width:48px;background:var(--ink)}
.foot{position:relative;z-index:1;margin:22px 0 0;font-size:11px;letter-spacing:.14em;color:var(--muted)}
/* 手機：導覽列只留標誌與日期、膠囊排到下面；大標題、左欄的兩顆膠囊在上，卡片列整排滑 */
@media (max-width:760px){
  .bar{grid-template-columns:auto 1fr}
  .seg{grid-column:1/-1;grid-row:2;justify-self:stretch;justify-content:space-between}
  .seg a{flex:1;text-align:center}
  .brand{justify-self:start}
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto;gap:18px;padding-top:26px}
  .side{flex-direction:row;flex-wrap:wrap;align-items:flex-start}
  .ghost{min-width:0}
  .note{display:none}
  .card{width:min(76vw,280px);height:340px}
  .dots{width:300px;height:300px;right:-120px;top:110px}
}
.pfx-arrive body{opacity:0}
@media (prefers-reduced-motion:reduce){.card{animation:none;transition:none}.prog i{transition:none}}
</style>

<script>
(()=>{
  const D=window.BOARD_DEPTS||[],$=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const href=d=>d.id==="rights"?"index.html":`index.html?d=${encodeURIComponent(d.id)}`;
  /* 卡片上的固定文字：英文小字、一句說明（不放會跟著資料變的數字） */
  const EN={president:"PRESIDENT",secretariat:"SECRETARIAT",rights:"STUDENT RIGHTS",marketing:"MARKETING",finance:"FINANCE",events:"EVENTS",affairs:"CLUB AFFAIRS",pr:"PUBLIC RELATIONS",works:"FACILITIES"};
  const TXT={president:"追蹤各部門的議題，開放秘書處的會議編輯。",secretariat:"整理各部門的會議報告事項，調閱每週概述。",rights:"學生權益議題的處理進度與即時回報。",marketing:"宣傳、社群內容的排程與進度。",finance:"經費、帳務與核銷的處理進度。",events:"活動籌備、場地與時程的進度。",affairs:"社團事務與相關議題的處理進度。",pr:"對外聯繫、合作與公關事務的進度。",works:"設備、場地維護與工務事項的進度。"};
  const ARROW=`<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 11.5 11.5 4.5M5.5 4.5h6v6"/></svg>`;
  const order=[...D.filter(d=>d.id==="president"||d.id==="secretariat"),...D.filter(d=>d.id!=="president"&&d.id!=="secretariat")];   /* 會長室、秘書處排最前面 */
  $("track").innerHTML=order.map((d,i)=>`<a class="card" data-g="${esc(d.id)}" href="${href(d)}" style="--i:${i}"><span class="tile"><span class="en">${EN[d.id]||esc(d.id).toUpperCase()}</span><b>${esc(d.name)}</b></span><span class="dash"></span><p>${TXT[d.id]||`${esc(d.name)}的工作進度。`}</p><span class="go">${ARROW}</span></a>`).join("");
  /* 日期膠囊（只有今天的日期，大小固定） */
  {const t=new Date(),W="日一二三四五六";$("todayTxt").textContent=`${String(t.getMonth()+1).padStart(2,"0")}.${String(t.getDate()).padStart(2,"0")} 週${W[t.getDay()]}`}
  /* 卡片列：左右箭頭一次捲一個畫面寬；進度條＝共幾段、目前在哪一段；電腦用直的滾輪也能左右換 */
  const tr=$("track"),prog=$("prog");
  const pages=()=>Math.max(1,Math.ceil((tr.scrollWidth-2)/tr.clientWidth));
  function sync(){const n=pages(),max=tr.scrollWidth-tr.clientWidth,k=max<=1?0:Math.round(tr.scrollLeft/max*(n-1));
    if(prog.children.length!==n)prog.innerHTML="<i></i>".repeat(n);[...prog.children].forEach((x,i)=>x.classList.toggle("on",i===k));
    $("prev").disabled=tr.scrollLeft<=2;$("next").disabled=tr.scrollLeft>=max-2}
  const step=dir=>{const c=tr.querySelector(".card"),gap=14,w=c?c.getBoundingClientRect().width+gap:300,per=Math.max(1,Math.floor((tr.clientWidth+gap)/w));tr.scrollBy({left:dir*per*w,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})};
  $("prev").onclick=()=>step(-1);$("next").onclick=()=>step(1);
  tr.addEventListener("scroll",()=>requestAnimationFrame(sync),{passive:true});addEventListener("resize",sync);
  tr.addEventListener("wheel",e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)&&tr.scrollWidth>tr.clientWidth){const max=tr.scrollWidth-tr.clientWidth;if((e.deltaY<0&&tr.scrollLeft>0)||(e.deltaY>0&&tr.scrollLeft<max)){e.preventDefault();tr.scrollLeft+=e.deltaY}}},{passive:false});
  sync();
  /* 點卡片、膠囊換頁：pagefx.js 會攔下站內連結，這一頁往後退（模糊）再換頁，看板從後面浮上來 */
  splashOut();   /* 開場動畫播完（字型好了、至少 0.6 秒）才淡出（core/js/splash.js） */
})();
</script>
