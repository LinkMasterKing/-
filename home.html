<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>南臺科技大學學生會｜各部門工作進度</title>
<meta name="description" content="南臺科技大學學生會各部門的工作看板入口。">
<link rel="icon" href="dept/icons/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 總覽首頁：列出所有部門的看板。沿用看板的視覺語言（純黑底／白底、細框、長箭頭、紅色重點），自成一頁不載入看板程式 */
:root{--bg:#fff;--ink:#111114;--muted:#5d5d66;--hair:#e2e2e8;--line:#111114;--red:#e0342a;--ok:#3ccf7f;--ease:cubic-bezier(.2,.9,.25,1);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#000;--ink:#f1f1f4;--muted:#a3a3ae;--hair:#2c2c34;--line:#f1f1f4;--red:#ff5a4e;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,"PingFang TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) max(clamp(16px,3vw,40px),env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) max(clamp(16px,3vw,40px),env(safe-area-inset-left))}
.num{font-family:"Jost",sans-serif}
/* 頁首 */
.hero{display:grid;gap:10px;padding-bottom:18px;border-bottom:1.5px solid var(--ink)}
.eyebrow{display:flex;align-items:center;gap:12px;font-family:"Jost",sans-serif;font-size:13px;letter-spacing:.16em;color:var(--ink)}
.eyebrow small{font-family:"Noto Sans TC",sans-serif;font-size:11px;letter-spacing:.12em;color:var(--muted)}
.hero h1{margin:0;font-size:clamp(28px,4.4vw,44px);font-weight:400;letter-spacing:.08em}
.hero p{margin:0;font-size:13px;color:var(--muted)}
/* 區塊標題＋細線長箭頭 */
.sec-h{display:flex;align-items:center;gap:12px;margin:32px 0 6px;font-size:17px;font-weight:500;letter-spacing:.1em}
.sec-h .en{font-family:"Jost",sans-serif;font-size:11px;letter-spacing:.2em;color:var(--muted)}
.arrow{flex:1;height:1px;background:var(--ink);position:relative}
.arrow::after{content:"";position:absolute;right:0;top:-5px;width:10px;height:10px;border-top:1px solid var(--ink);border-right:1px solid var(--ink);transform:rotate(45deg);transform-origin:center}
/* 部門清單：整列是連結、列與列之間細線；寬的時候兩欄 */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));column-gap:28px}
.dept{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px 16px;padding:18px 4px;border-top:1px solid var(--hair);color:inherit;text-decoration:none;border-radius:0;transition:background-color .2s}
.dept:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
/* 手機點一下：不要系統的藍色點擊反白、也不要長按選取整列文字；改成跟 hover 一樣的淡底 */
.dept{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.dept:active{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.dept:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.dept b{font-size:20px;font-weight:700;letter-spacing:.1em}
.dept .stat{grid-column:1;display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.dept .stat .n{font-size:15px;color:var(--ink);margin-right:3px}
.dept .stat .red .n{color:var(--red)}
.dept .go{grid-row:1/3;grid-column:2;font-family:"Jost",sans-serif;font-size:13px;letter-spacing:.12em;color:var(--muted);display:flex;align-items:center;gap:8px;transition:transform .25s var(--ease),color .2s}
.dept:hover .go{transform:translateX(4px);color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--red);display:inline-block;margin-right:6px;vertical-align:1px}
/* 會長室：放最上面、字大一點 */
.lead .dept{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:22px 4px}
.lead .dept b{font-size:24px}
.foot{margin-top:36px;font-size:12px;color:var(--muted)}
/* 換頁動畫（core/js/pagefx.js）：站內換頁過來時 body 先透明，等它從後面浮上來 */
.pfx-arrive body{opacity:0}
@media (prefers-reduced-motion:no-preference){.dept{animation:in .5s var(--ease) both;animation-delay:calc(var(--i,0)*40ms)}@keyframes in{from{opacity:0;transform:translateY(8px)}}}
</style>
<script>/* 換頁動畫（core/js/pagefx.js）：從站內換頁過來的，body 先透明，等它從後面浮上來（不會先閃一下完整的畫面） */try{var r=document.referrer,n=performance.getEntriesByType("navigation")[0];if(r&&new URL(r).origin===location.origin&&(!n||n.type!=="reload")&&!matchMedia("(prefers-reduced-motion: reduce)").matches)document.documentElement.classList.add("pfx-arrive")}catch(e){}</script>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="eyebrow">WORK&nbsp;&nbsp;BOARDS<small>工作看板</small></div>
    <h1>各部門工作進度</h1>
    <p>南臺科技大學學生會 · 點一個部門進入它的看板</p>
  </header>
  <div class="lead" id="lead"></div>
  <h2 class="sec-h">各部門<span class="en">DEPARTMENTS</span><span class="arrow" aria-hidden="true"></span></h2>
  <div class="list" id="list"></div>
  <p class="foot">數字是各部門最近一次儲存的內容；「沒有進度」＝即時回報在回報期限前後都沒有更新。</p>
</div>
<script src="core/js/pagefx.js"></script>
<script src="dept/config.js"></script>
<script>
/* 各部門清單來自 dept/config.js 的 BOARD_DEPTS；數字讀各部門網站上的資料檔（只讀） */
(()=>{
  const D=window.BOARD_DEPTS||[],esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const href=d=>d.id==="rights"?"index.html":`index.html?d=${encodeURIComponent(d.id)}`;
  const pd=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)},ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  /* 跟看板同一套判斷：回報期限（預設週二）前後都沒更新＝沒有進度 */
  const cut=+((window.BOARD_CONFIG||{}).week||{}).cutoff||2;
  const stall=e=>{const t=new Date(),back=(t.getDay()-cut+7)%7,due=new Date(t);due.setDate(t.getDate()-back);const prev=new Date(due);prev.setDate(due.getDate()-7);
    const P=ymd(prev),ds=(e.touched&&e.touched.length?e.touched:[e.createdAt||""]).map(x=>String(x).slice(0,10));
    if(e.roundAt&&String(e.roundAt).slice(0,10)>P)return false;if((e.createdAt||"")>ymd(due))return false;return !ds.some(x=>x>P)};
  const row=(d,i,s)=>`<a class="dept" href="${href(d)}" style="--i:${i}"><b>${esc(d.name)}</b>
    <span class="stat">${s}</span><span class="go">開啟<span aria-hidden="true">→</span></span></a>`;
  const statOf=(d,data)=>{
    if(!data)return "尚未建立 · 第一次進去儲存後才會有資料";
    if(d.follow)return `<span><span class="n num">${(data.follows||[]).length}</span>個追蹤項目</span>${data.savedAt?`<span>最後儲存 ${esc(String(data.savedAt).slice(5,10).replace("-","/"))}</span>`:""}`;
    const live=(data.events||[]).filter(e=>!e.doneAt),st=live.filter(stall).length,act=(data.issues||[]).filter(i=>!i.doneAt&&!((+i.progress||0)>=100)).length;
    return `<span><span class="n num">${live.length}</span>即時回報</span>${st?`<span class="red"><span class="dot" aria-hidden="true"></span><span class="n num">${st}</span>沒有進度</span>`:""}<span><span class="n num">${act}</span>進行中議題</span>${data.savedAt?`<span>最後儲存 ${esc(String(data.savedAt).slice(5,10).replace("-","/"))}</span>`:""}`;
  };
  const lead=D.filter(d=>d.follow),rest=D.filter(d=>!d.follow);
  const draw=cache=>{
    document.getElementById("lead").innerHTML=lead.map((d,i)=>row(d,i,cache.has(d.id)?statOf(d,cache.get(d.id)):"讀取中…")).join("");
    document.getElementById("list").innerHTML=rest.map((d,i)=>row(d,i+1,cache.has(d.id)?statOf(d,cache.get(d.id)):"讀取中…")).join("");
  };
  const cache=new Map();draw(cache);
  Promise.all(D.map(d=>fetch(d.path,{cache:"no-cache"}).then(r=>r.ok?r.json():null).catch(()=>null).then(x=>cache.set(d.id,x)))).then(()=>{
    /* 第二次畫時不要再播進場動畫 */
    document.querySelectorAll(".dept").forEach(a=>a.style.animation="none");
    const keep=document.body.offsetHeight;draw(cache);document.querySelectorAll(".dept").forEach(a=>a.style.animation="none");
  });
})();
</script>
</body>
</html>
